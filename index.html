<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Zor bir anda durup düşünmene ve doğru adımı seçmene destek olan küçük bir uygulama.">
  <title>Karar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="sayfa">

    <header class="ust">
      <div class="isaret" aria-hidden="true"><span></span><span></span></div>
      <h1>Karar</h1>
      <p class="slogan">Bir an dur. Seçim senin.</p>
    </header>

    <section class="orta" aria-labelledby="kutular-baslik">
      <h2 id="kutular-baslik">Konu kutuların</h2>

      <ul class="kutu-listesi" id="kutu-listesi"></ul>
      <p class="secim-bilgi" id="secim-bilgi" aria-live="polite"></p>

      <div class="kart yeni-kutu">
        <button type="button" class="yeni-dugme" id="yeni-ac" aria-expanded="false" aria-controls="kutu-formu">
          <span aria-hidden="true">＋</span> Kendi kutunu aç
        </button>

        <form id="kutu-formu" class="kutu-formu" hidden novalidate>
          <label for="kutu-ad">Kutunun adı</label>
          <input id="kutu-ad" type="text" maxlength="24" placeholder="örn. Gece telefonu" autocomplete="off">

          <label for="kutu-emoji">Emoji <span class="istege-bagli">(isteğe bağlı)</span></label>
          <input id="kutu-emoji" type="text" maxlength="12" placeholder="🌙" autocomplete="off">
          <p class="ipucu">Windows'ta emoji klavyesi: Windows tuşu + nokta. Boş bırakırsan ya da emoji dışında bir şey yazarsan 🌱 kullanılır.</p>

          <label for="kutu-hedef">Hedefin <span class="istege-bagli">(isteğe bağlı)</span></label>
          <input id="kutu-hedef" type="text" maxlength="80" placeholder="örn. Akşamları atıştırmamak" autocomplete="off">

          <p class="form-hata" id="form-hata" role="alert"></p>

          <div class="form-dugmeler">
            <button type="submit" class="dugme-ana">Kutuyu aç</button>
            <button type="button" class="dugme-ikincil" id="vazgec">Vazgeç</button>
          </div>
        </form>
      </div>

      <noscript><p class="yardimci">Bu uygulama JavaScript ile çalışır. Tarayıcında JavaScript kapalı görünüyor.</p></noscript>
    </section>

    <footer class="alt">
      <p>Bu uygulama tıbbi veya psikolojik tavsiye değildir. Zorlandığında bir uzmandan destek almak güçlü bir adımdır.</p>
    </footer>

  </main>
  <script src="app.js"></script>
</body>
</html>
